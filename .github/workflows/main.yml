
name: Compilar APK do Quiz

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)
          test -n "$ZIP"
          unzip -o "$ZIP" -d projeto
          find projeto \( -name settings.gradle -o -name settings.gradle.kts \)

      - name: Compilar APK
        run: |
          SETTINGS=$(find projeto -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          test -n "$SETTINGS"
          DIR=$(dirname "$SETTINGS")
          cd "$DIR"
          gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AgenteQuizBandeiras-debug-apk
          path: projeto/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
