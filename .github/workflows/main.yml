
name: Compilar APK do Quiz

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e
          mkdir -p projeto

          ZIP=$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: Nenhum arquivo ZIP encontrado na raiz do repositório."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          unzip -o "$ZIP" -d projeto

          echo "Arquivos Gradle encontrados:"
          find projeto -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \)

      - name: Localizar e compilar APK
        shell: bash
        run: |
          set -e

          SETTINGS=$(find projeto -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            echo "Arquivos extraídos:"
            find projeto -maxdepth 6 -type f | head -n 150
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")
          echo "Pasta do projeto Android: $DIR"
          cd "$DIR"

          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "ERRO: arquivo Gradle do módulo app não encontrado."
            find . -maxdepth 4 -type f
            exit 1
          fi

          gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AgenteQuizBandeiras-debug-apk
          path: projeto/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
